<style>

/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, Segoe UI, Arial;
  background: linear-gradient(135deg, #020617, #0f172a);
  color: #e6eef8;
  padding: 24px;
}

/* WRAPPER */
.wrap {
  max-width: 1100px;
  margin: auto;
}

/* HEADER */
header {
  display: flex;
  gap: 20px;
  align-items: center;
  flex-wrap: wrap;
}

.photo {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  border: 3px solid #38bdf8;
  object-fit: cover;
  object-position: center top;
  transition: 0.4s;
}

.photo:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px #38bdf8;
}

h1 {
  color: #38bdf8;
}

.bio {
  opacity: 0.85;
}

a {
  color: #38bdf8;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 10px 18px;
  background: linear-gradient(90deg, #38bdf8, #0ea5e9);
  color: #020617;
  border-radius: 8px;
  font-weight: bold;
}

/* SECTIONS */
section {
  margin-top: 30px;
  padding: 24px;
  border-radius: 14px;
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(56,189,248,0.2);
  backdrop-filter: blur(10px);
}

h2 {
  margin-bottom: 15px;
  border-bottom: 2px solid #38bdf8;
  padding-bottom: 6px;
}

h3 {
  margin-bottom: 10px;
  color: #a0e7ff;
}

/* SKILLS */
.skill {
  margin: 10px 0;
}

.skill-bar {
  background: #071026;
  border-radius: 6px;
  overflow: hidden;
}

.skill-fill {
  height: 10px;
  background: linear-gradient(90deg, #38bdf8, #0ea5e9);
  width: 0;
  transition: 1.2s;
}

/* GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
}

/* PROJECT CARD */
.card {
  background: #071026;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 10px 25px rgba(56,189,248,0.3);
}

/* IMAGE */
.card img {
  width: 100%;
  height: 200px;
  object-fit: contain;
  background: #020617;
  padding: 8px;
}

/* CONTENT */
.card-content {
  padding: 15px;
}

/* CV BOX */
.cv-box {
  text-align: center;
  padding: 30px;
  border: 1px dashed #38bdf8;
  border-radius: 12px;
}

/* ANIMATION */
.fade {
  opacity: 0;
  transform: translateY(30px);
  transition: 0.8s;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

footer {
  margin-top: 40px;
  text-align: center;
  opacity: 0.7;
}

/* ========================= */
/* 📱 MOBILE FIX (IMPORTANT) */
/* ========================= */
@media (max-width: 768px) {

  body {
    padding: 14px;
  }

  /* HEADER FIX */
  header {
    flex-direction: column;
    text-align: center;
  }

  .photo {
    width: 110px;
    height: 110px;
  }

  h1 {
    font-size: 22px;
  }

  .bio {
    font-size: 14px;
  }

  .btn {
    padding: 8px 14px;
    font-size: 14px;
  }

  /* SECTIONS */
  section {
    padding: 18px;
  }

  h2 {
    font-size: 18px;
  }

  h3 {
    font-size: 15px;
  }

  p {
    font-size: 14px;
    line-height: 1.5;
  }

  /* GRID FIX (CRITICAL) */
  .grid {
    grid-template-columns: 1fr; /* ensures ALL projects show */
    gap: 16px;
  }

  /* CARD */
  .card {
    width: 100%;
  }

  /* IMAGE FIX */
  .card img {
    height: auto; /* show full image */
    max-height: 220px;
  }

}

</style>
