<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohamed Ayman — Software Engineer</title>

<style>
/* RESET */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', sans-serif;
  background: radial-gradient(circle at top, #0f172a, #020617);
  color: #e2e8f0;
  padding: 20px;
}

/* WRAPPER */
.wrap {
  max-width: 1100px;
  margin: auto;
}

/* HEADER */
header {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}

.photo {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px solid #38bdf8;
  transition: 0.4s;
}
.photo:hover {
  transform: scale(1.1) rotate(2deg);
  box-shadow: 0 0 25px #38bdf8;
}

h1 {
  font-size: 32px;
  color: #38bdf8;
}

.bio {
  opacity: 0.8;
}

/* SECTION */
section {
  margin-top: 30px;
  padding: 25px;
  border-radius: 15px;
  backdrop-filter: blur(12px);
  background: rgba(255,255,255,0.03);
  border: 1px solid rgba(56,189,248,0.2);
  transition: 0.3s;
}

section:hover {
  border-color: #38bdf8;
}

/* PROJECT GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
}

/* PROJECT CARD */
.card {
  position: relative;
  overflow: hidden;
  border-radius: 15px;
  cursor: pointer;
}

/* IMAGE */
.card img {
  width: 100%;
  height: 200px;
  object-fit: cover;
  transition: 0.4s;
}

/* OVERLAY */
.overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 15px;
  background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
  transform: translateY(100%);
  transition: 0.4s;
}

.card:hover img {
  transform: scale(1.1);
}

.card:hover .overlay {
  transform: translateY(0);
}

/* TEXT */
.overlay h4 {
  color: #38bdf8;
}

.overlay p {
  font-size: 14px;
  opacity: 0.85;
}

/* BUTTON */
.btn {
  display: inline-block;
  margin-top: 10px;
  padding: 8px 14px;
  background: #38bdf8;
  color: black;
  border-radius: 6px;
  font-weight: bold;
  text-decoration: none;
}

/* ANIMATION */
.fade {
  opacity: 0;
  transform: translateY(40px);
  transition: 0.8s ease;
}

.fade.show {
  opacity: 1;
  transform: translateY(0);
}

</style>
</head>

<body>

<div class="wrap">

<header class="fade">
<img class="photo" src="IMG_1997.jpeg">
<div>
<h1>HAMIDI Mohamed Ayman</h1>
<div class="bio">Full-Stack Software Engineer — Java / Spring Boot / Angular</div>
</div>
</header>

<section class="fade">
<h2>Projects</h2>

<div class="grid">

<!-- PROJECT 1 -->
<div class="card">
<img src="screenshots/dreamcream.jpg">
<div class="overlay">
<h4>Dream Cream Truck</h4>
<p>Angular UI with dynamic menu & animations</p>
<a class="btn" href="https://github.com/mohamedaymanhamidi/dream-cream-truck">View</a>
</div>
</div>

<!-- PROJECT 2 -->
<div class="card">
<img src="screenshots/hbmoving.jpg">
<div class="overlay">
<h4>HB Moving</h4>
<p>Custom WordPress + booking system</p>
<a class="btn" href="#">View</a>
</div>
</div>

<!-- PROJECT 3 -->
<div class="card">
<img src="screenshots/ocp.jpg">
<div class="overlay">
<h4>OCP Platform</h4>
<p>Angular + Spring Boot enterprise app</p>
<a class="btn" href="#">View</a>
</div>
</div>

</div>
</section>

</div>

<script>
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if(entry.isIntersecting){
      entry.target.classList.add('show');
    }
  });
});

document.querySelectorAll('.fade').forEach(el => observer.observe(el));
</script>

</body>
</html>
